<!doctype html>
<!-- Ícone do Yield: "yield" branco + "." verde-limão, fundo grafite igual ao do NeyHub. -->
<!-- Canvas 1024 com o quadrado em 824 (grade de ícones do macOS). Gerar: Chrome headless → icon.png → pnpm tauri icon -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
.ic{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
  background:linear-gradient(#202226,#121315);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,"SF Pro Display",sans-serif;font-weight:800;line-height:1;letter-spacing:-.03em;
  font-size:230px;color:#fff}
.dot{color:#c6ff3d}
</style></head><body><div class="ic"><span>yield<span class="dot">.</span></span></div></body></html>
