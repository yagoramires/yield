name: Release
# Publica uma Release ao enviar uma tag v* (ex.: git tag v0.2.0 && git push origin v0.2.0).
# O updater do app lê o latest.json desta Release; os pacotes são assinados com a chave dos secrets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            # Certificado autoassinado "Yield Local": com assinatura fixa o "Permitir Sempre" do Keychain vale entre versões.
            sign: 781233772447628F41724863ED535FCBF60F41C9
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Certificado de assinatura no keychain temporário
        if: matrix.sign
        env:
          P12: ${{ secrets.YIELD_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.YIELD_CODESIGN_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/yield.keychain-db"; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -t 3600 -u "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC" | grep ${{ matrix.sign }}
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.sign }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yield ${{ github.ref_name }}
          releaseBody: "O que mudou nesta versão: https://github.com/yagoramires/yield/blob/main/CHANGELOG.md"
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
